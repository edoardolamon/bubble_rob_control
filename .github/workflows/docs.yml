# .github/workflows/docs.yml -- build the documentation and publish it on GitHub Pages
name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write      # deploy to Pages
  id-token: write   # prove to Pages that the deployment comes from this workflow

concurrency:        # do not deploy two pushes at the same time
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen graphviz python3-sphinx python3-breathe \
            python3-myst-parser python3-sphinx-rtd-theme

      - name: Doxygen
        run: |
          mkdir -p docs/_build
          doxygen docs/Doxyfile

      - name: Sphinx
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
